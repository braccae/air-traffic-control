<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROX-ORCH Datacenter &amp; Homelab Orchestrator</title>
    <meta name="description" content="Enterprise-grade datacenter and homelab orchestration dashboard featuring Cockpit-bridge, Podman pods, Glances telemetry, Restic backups, Tailscale mesh, and Go SSH backend." />
    <meta property="og:title" content="PROX-ORCH Datacenter &amp; Homelab Orchestrator" />
    <meta property="og:description" content="Enterprise-grade datacenter and homelab orchestration dashboard featuring Cockpit-bridge, Podman pods, Glances telemetry, Restic backups, Tailscale mesh, and Go SSH backend." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('prox_orch_theme');
          var resolved = 'macchiato';
          if (stored === 'latte') {
            resolved = 'latte';
          } else if (stored === 'macchiato' || stored === 'dark') {
            resolved = 'macchiato';
          } else {
            // 'system' or unset/empty: follow prefers-color-scheme
            var isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolved = isDark ? 'macchiato' : 'latte';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (stored) {
            document.documentElement.setAttribute('data-theme-choice', stored);
          }
          if (resolved === 'latte') {
            document.documentElement.classList.add('theme-latte');
            document.documentElement.classList.remove('theme-macchiato');
          } else {
            document.documentElement.classList.add('theme-macchiato');
            document.documentElement.classList.remove('theme-latte');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#0f1224] text-[#dfe1fa] antialiased min-h-screen selection:bg-[#395d9f] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
