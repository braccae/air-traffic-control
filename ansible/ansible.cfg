[defaults]
; ansible-core 2.19+ no longer bundles the `json` stdout callback.
; The coordinator sets ANSIBLE_CALLBACK_PLUGINS itself; this keeps CLI runs working.
callback_plugins = ./plugins/callback
vault_password_file = ../data/.vault-password
stdout_callback = json
forks = 10
timeout = 30
host_key_checking = False
pipelining = True

[privilege_escalation]
become_method = community.general.run0
